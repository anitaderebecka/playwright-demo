name: 'Playwright Tests'
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        type: environment
        default: 'staging'
      test_type:
        description: 'Test type'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - smoke

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests on ${{ github.event.inputs.environment }}
        run: |
          if [[ "${{ github.event.inputs.test_type }}" == "smoke" ]]; then
            echo "Running Playwright smoke tests..."
            npx playwright test --grep @${{ github.event.inputs.test_type }}
          else
            echo "Running Playwright tests with default project..."
            npx playwright test
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
